name: Windows x64 Release Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build-version:
        description: "The display version to build"
        required: true
        type: string
        default: "1.21.3b"
      firefox-channel:
        description: "Firefox release channel to bundle; Nightly currently fails early because Surfer cannot download a1 release artifacts"
        required: true
        type: choice
        default: "stable"
        options:
          - stable
          - beta
      firefox-version:
        description: "Exact Firefox version to bundle when not using latest"
        required: true
        type: string
        default: "152.0.1"
      use-latest-firefox:
        description: "Use latest version for the selected Firefox channel"
        required: true
        type: boolean
        default: false
      check-patches:
        description: "Dry-run all patches before import"
        required: true
        type: boolean
        default: false
      release-branch:
        description: "The release brand to build"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - twilight
      use-sccache:
        description: "Use sccache"
        required: true
        type: boolean
        default: false

jobs:
  buildid:
    name: Generate build ID
    runs-on: ubuntu-latest
    outputs:
      buildid: ${{ steps.get.outputs.buildid }}
    steps:
      - id: get
        shell: bash
        run: |
          buildid="$(date +"%Y%m%d%H%M%S")"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows x64
    uses: ./.github/workflows/windows-release-build.yml
    needs: buildid
    secrets: inherit
    with:
      arch: x86_64
      build-version: ${{ inputs.build-version }}
      firefox-channel: ${{ inputs.firefox-channel }}
      firefox-version: ${{ inputs.firefox-version }}
      use-latest-firefox: ${{ inputs.use-latest-firefox }}
      check-patches: ${{ inputs.check-patches }}
      generate-gpo: false
      release-branch: ${{ inputs.release-branch }}
      MOZ_BUILD_DATE: ${{ needs.buildid.outputs.buildid }}
      use-sccache: ${{ inputs.use-sccache }}
      standalone-artifact: true
